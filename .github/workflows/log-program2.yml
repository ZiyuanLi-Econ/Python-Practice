name: Log Python Program 2

on:
  schedule:
    # GitHub cron uses UTC. Run at both candidate UTC hours and keep only
    # the invocation that is 17:00 in Europe/Berlin (handles DST).
    - cron: '0 15 * * 1-5'
    - cron: '0 16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log-program2:
    runs-on: ubuntu-latest

    steps:
      - name: Check Berlin time
        id: timecheck
        run: |
          HOUR=$(TZ=Europe/Berlin date +%H)
          if [ "$HOUR" = "17" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Add today's Program 2 row
        if: steps.timecheck.outputs.run == 'true'
        run: |
          DATE=$(TZ=Europe/Berlin date +%d.%m.%Y)
          ROW="| N/A   | ${DATE}        | Python Program 2        |"

          if grep -Fq "| N/A   | ${DATE}        | Python Program 2" README.md; then
            echo "Today's Program 2 row already exists."
            exit 0
          fi

          printf '%s\n' "$ROW" >> README.md

      - name: Commit and push
        if: steps.timecheck.outputs.run == 'true'
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          DATE=$(TZ=Europe/Berlin date +%d.%m.%Y)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Log Python Program 2 for ${DATE}"
          git push
